name: Daily TV audience scrape

on:
  schedule:
    # IMPORTANT — minutes décalées (pas 0) parce que GitHub Actions a des
    # crons "best effort" sur le tier gratuit. Les heures pile (8h00, 9h00)
    # sont saturées et souvent retardées ou skippées. Les minutes
    # décalées (17, 32, 47) ont une probabilité d'exécution bien meilleure.
    #
    # Trois passages quotidiens :
    # - 8h17 UTC = 10h17 Paris (été) / 9h17 (hiver) : sources rapides (DE, ES, IT)
    # - 9h32 UTC = 11h32 Paris (été) / 10h32 (hiver) : retry pour FR (Ozap)
    # - 12h47 UTC = 14h47 Paris (été) / 13h47 (hiver) : rattrapage des
    #   audiences du dimanche soir (Ozap publie souvent vers 12h-13h le lundi)
    #
    # Les scrapers sont idempotents : tourner 3x dans la journée n'a pas
    # d'effet de bord. Les commentaires Gemini ne sont regénérés que si
    # la date des données a changé (cf. commentary_date dans commentary.py).
    - cron: '17 8 * * *'
    - cron: '32 9 * * *'
    - cron: '47 12 * * *'
  workflow_dispatch:  # permet de lancer manuellement depuis l'interface GitHub

permissions:
  contents: write   # nécessaire pour pousser les fichiers data/ mis à jour

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all scrapers
        run: |
          python scrapers/fr_ozap.py || echo "::warning::FR scraper failed"
          python scrapers/de_dwdl.py || echo "::warning::DE scraper failed"
          python scrapers/es_barlovento.py || echo "::warning::ES scraper failed"
          python scrapers/it_davidemaggio.py || echo "::warning::IT scraper failed"
          python scrapers/nl_televizier.py || echo "::warning::NL scraper failed"
        env:
          PYTHONUNBUFFERED: 1

      - name: Generate editorial commentaries
        run: |
          python scrapers/commentary.py || echo "::warning::commentary generation failed (non-blocking)"
        env:
          PYTHONUNBUFFERED: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Daily audience update — $(date -u +%Y-%m-%d)"
            git push
          fi
