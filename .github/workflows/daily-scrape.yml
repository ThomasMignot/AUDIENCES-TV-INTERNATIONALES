name: Daily TV audience scrape

on:
  schedule:
    # SIX passages quotidiens pour compenser le caractère "best effort" des
    # crons GitHub Actions sur le tier gratuit. GitHub peut skipper un cron
    # individuel sans avertissement quand sa file d'attente est saturée.
    # Avec 6 crons, la probabilité qu'aucun ne tourne devient très faible.
    #
    # Toutes les heures sont en UTC. Les minutes sont décalées (pas 0 ni 30)
    # parce que les heures rondes sont saturées et plus susceptibles d'être
    # skippées.
    #
    # Plage couverte : 7h22 → 14h36 UTC = 9h22 → 16h36 Paris (été)
    #                                      8h22 → 15h36 Paris (hiver)
    #
    # Les scrapers sont idempotents : tourner 6× dans la journée n'a pas
    # d'effet de bord sur le contenu. Les commentaires Gemini ne sont
    # regénérés que si la date des données a changé (cf. commentary_date
    # dans commentary.py), donc 5-6 requêtes Gemini par jour seulement,
    # peu importe le nombre de crons qui tournent.
    - cron: '22 7 * * *'   # 9h22 Paris (été) — sources rapides allemande/espagnole/italienne
    - cron: '13 9 * * *'   # 11h13 Paris — retry pour FR (Ozap publie souvent vers 10h-11h)
    - cron: '47 10 * * *'  # 12h47 Paris — sécurité midi
    - cron: '36 12 * * *'  # 14h36 Paris — rattrapage mi-journée (Ozap parfois en retard le lundi)
    - cron: '17 14 * * *'  # 16h17 Paris — dernière chance
    - cron: '8 16 * * *'   # 18h08 Paris — filet de sécurité fin journée

  workflow_dispatch:  # permet de lancer manuellement depuis l'interface GitHub

permissions:
  contents: write   # nécessaire pour pousser les fichiers data/ mis à jour

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all scrapers
        run: |
          python scrapers/fr_ozap.py || echo "::warning::FR scraper failed"
          python scrapers/de_dwdl.py || echo "::warning::DE scraper failed"
          python scrapers/es_barlovento.py || echo "::warning::ES scraper failed"
          python scrapers/it_davidemaggio.py || echo "::warning::IT scraper failed"
          python scrapers/nl_televizier.py || echo "::warning::NL scraper failed"
        env:
          PYTHONUNBUFFERED: 1

      - name: Generate editorial commentaries
        run: |
          python scrapers/commentary.py || echo "::warning::commentary generation failed (non-blocking)"
        env:
          PYTHONUNBUFFERED: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Daily audience update — $(date -u +%Y-%m-%d)"
            git push
          fi
