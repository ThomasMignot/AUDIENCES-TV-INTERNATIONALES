name: Daily TV audience scrape

on:
  schedule:
    # Deux passages : certaines sources publient plus tôt que d'autres.
    # - 8h UTC = 9h hiver / 10h été Paris : premier essai, rattrape les
    #   sources rapides (DE, ES, IT publient souvent avant 9h Paris)
    # - 9h UTC = 10h hiver / 11h été Paris : retry pour les sources
    #   plus lentes (Ozap FR publie parfois vers 10h heure Paris)
    # Les scrapers sont idempotents : s'ils tournent deux fois avec les
    # mêmes données, ils réécrivent simplement l'entrée. Les commentaires
    # Gemini sont préservés (fix commentary_date dans commentary.py).
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:  # permet de lancer manuellement depuis l'interface GitHub

permissions:
  contents: write   # nécessaire pour pousser les fichiers data/ mis à jour

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all scrapers
        run: |
          python scrapers/fr_ozap.py || echo "::warning::FR scraper failed"
          python scrapers/de_dwdl.py || echo "::warning::DE scraper failed"
          python scrapers/es_barlovento.py || echo "::warning::ES scraper failed"
          python scrapers/it_davidemaggio.py || echo "::warning::IT scraper failed"
          python scrapers/nl_televizier.py || echo "::warning::NL scraper failed"
        env:
          PYTHONUNBUFFERED: 1

      - name: Generate editorial commentaries
        run: |
          python scrapers/commentary.py || echo "::warning::commentary generation failed (non-blocking)"
        env:
          PYTHONUNBUFFERED: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Daily audience update — $(date -u +%Y-%m-%d)"
            git push
          fi
